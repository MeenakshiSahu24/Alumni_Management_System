{% extends "base.html" %}
{% block title %}Mentorship{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0">Mentorship</h4>
  <a href="{{ url_for('add_mentorship') }}" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg me-1"></i>Add Mentor
  </a>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr><th>Mentor</th><th>Topic</th><th>Availability</th><th>Actions</th></tr>
      </thead>
      <tbody>
        {% for r in records %}
        <tr>
          <td>{{ r.mentor_name }}</td>
          <td>{{ r.topic }}</td>
          <td>{{ r.availability or '—' }}</td>
          <td>
            <a href="{{ url_for('delete_mentorship', rec_id=r.id) }}"
               class="btn btn-sm btn-outline-danger"
               onclick="return confirm('Remove?')">
              <i class="bi bi-trash"></i>
            </a>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">No mentors registered yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
