{% extends "base.html" %}
{% block title %}Add Employment{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4 gap-2">
  <a href="{{ url_for('list_employment') }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h4 class="fw-bold mb-0">Add Employment Record</h4>
</div>

<div class="card p-4" style="max-width:500px;">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Alumni *</label>
      <select name="alumni_id" class="form-select" required>
        <option value="">— Select —</option>
        {% for a in alumni_list %}
        <option value="{{ a.id }}">{{ a.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Company *</label>
      <input type="text" name="company" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Designation *</label>
      <input type="text" name="designation" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">City</label>
      <input type="text" name="city" class="form-control">
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Start Year</label>
        <input type="number" name="start_year" class="form-control" min="1990" max="2099">
      </div>
      <div class="col mb-3">
        <label class="form-label">End Year <small class="text-muted">(blank = current)</small></label>
        <input type="number" name="end_year" class="form-control" min="1990" max="2099">
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save Record</button>
  </form>
</div>
{% endblock %}
