<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alumni Management System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .sidebar { min-height: 100vh; background: #1a2340; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #2c3e6b; border-radius: 6px; }
    .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.1rem; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
    .stat-card { border-left: 4px solid; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar p-3 d-flex flex-column">
      <div class="brand mb-4 mt-2 ps-2">
        <i class="bi bi-mortarboard-fill me-2"></i>Alumni MS
      </div>
      <nav class="nav flex-column gap-1">
        <a class="nav-link {% if request.endpoint=='index' %}active{% endif %}" href="{{ url_for('index') }}">
          <i class="bi bi-house me-2"></i>Dashboard
        </a>
        <a class="nav-link {% if 'alumni' in request.endpoint %}active{% endif %}" href="{{ url_for('list_alumni') }}">
          <i class="bi bi-people me-2"></i>Alumni
        </a>
        <a class="nav-link {% if 'employment' in request.endpoint %}active{% endif %}" href="{{ url_for('list_employment') }}">
          <i class="bi bi-briefcase me-2"></i>Employment
        </a>
        <a class="nav-link {% if 'mentorship' in request.endpoint %}active{% endif %}" href="{{ url_for('list_mentorship') }}">
          <i class="bi bi-person-check me-2"></i>Mentorship
        </a>
        <a class="nav-link {% if request.endpoint=='analytics' %}active{% endif %}" href="{{ url_for('analytics') }}">
          <i class="bi bi-bar-chart me-2"></i>Analytics
        </a>
      </nav>
    </div>

    <!-- Main content -->
    <div class="col-md-10 p-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
